# ===================================================================
# Application Configuration EXAMPLE — KAVIN TRAVELS Backend
# ===================================================================
# Copy this file to application.properties and fill in the actual values.
# NEVER commit application.properties with real credentials to Git.
# ===================================================================

server.port=8080
spring.application.name=car-travel-booking

# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/car_travel_booking?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:REPLACE_WITH_YOUR_MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT — Replace with a strong random secret (min 32 chars)
app.jwt.secret=${JWT_SECRET:REPLACE_WITH_STRONG_RANDOM_SECRET_MIN_32_CHARS}
app.jwt.expiration-ms=86400000

# Google Maps (optional)
app.google.maps.api-key=${GOOGLE_MAPS_API_KEY:YOUR_GOOGLE_MAPS_API_KEY}
app.google.maps.enabled=${GOOGLE_MAPS_ENABLED:false}

# Fare Rules
app.pricing.multiplier.one-way=1.0
app.pricing.multiplier.round-trip=2.0
app.pricing.multiplier.multi-day=2.0
app.pricing.driver-allowance.base=500.00
app.pricing.driver-allowance.per-extra-day=500.00

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5500,http://localhost:8080
