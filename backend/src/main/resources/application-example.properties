# ===================================================================
# Example Application Configuration Template: KAVIN TRAVELS Backend
# ===================================================================

server.port=8080
spring.application.name=car-travel-booking

# Database Connection (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/car_travel_booking?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=YOUR_MYSQL_USERNAME
spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# JWT Security Configuration
app.jwt.secret=carTravelBookingSuperSecretKeyForJwtAuthentication2026ShouldBe256BitsLong!
app.jwt.expiration-ms=86400000

# Google Maps API Configuration
app.google.maps.api-key=YOUR_GOOGLE_MAPS_API_KEY
app.google.maps.enabled=false

# Fare & Pricing Rules
app.pricing.multiplier.one-way=1.0
app.pricing.multiplier.round-trip=2.0
app.pricing.multiplier.multi-day=2.0
app.pricing.driver-allowance.base=500.00
app.pricing.driver-allowance.per-extra-day=500.00

# CORS Allowed Origins
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5500,http://localhost:8080
