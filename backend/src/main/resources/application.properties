# ===================================================================
# Application Configuration: Car Travel Booking System Backend
# ===================================================================

server.port=8080
spring.application.name=car-travel-booking

# ===================================================================
# Database Connection (MySQL)
# ===================================================================
# Connect to your existing MySQL database 'car_travel_booking'
# Replace 'YOUR_PASSWORD' with your actual MySQL root password or pass it via DB_PASSWORD env var
spring.datasource.url=jdbc:mysql://localhost:3306/car_travel_booking?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:YOUR_MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
# STRICT RULE: Do not use 'create' or 'create-drop'
# 'none' disables auto-DDL execution and ensures existing tables remain the single source of truth
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# ===================================================================
# JWT (Security) Configuration
# ===================================================================
# 256-bit secure secret key for signing JWT tokens (HMAC-SHA256)
app.jwt.secret=${JWT_SECRET:carTravelBookingSuperSecretKeyForJwtAuthentication2026ShouldBe256BitsLong!}
app.jwt.expiration-ms=86400000

# ===================================================================
# Google Maps API Configuration
# ===================================================================
# Provide your Google Maps Platform Directions/Routes API key here or via env variable
app.google.maps.api-key=${GOOGLE_MAPS_API_KEY:YOUR_GOOGLE_MAPS_API_KEY}
app.google.maps.enabled=${GOOGLE_MAPS_ENABLED:false}

# ===================================================================
# Fare & Pricing Rules (Configurable Multipliers & Driver Allowance)
# ===================================================================
# Trip Multipliers:
# One Way = 1.0, Round Trip = 2.0, Multi-Day = 2.0 (per day baseline)
app.pricing.multiplier.one-way=1.0
app.pricing.multiplier.round-trip=2.0
app.pricing.multiplier.multi-day=2.0

# Base Driver Allowance per day / trip in INR (₹)
app.pricing.driver-allowance.base=500.00
app.pricing.driver-allowance.per-extra-day=500.00

# ===================================================================
# CORS (Cross-Origin Resource Sharing) Configuration
# ===================================================================
# Allowed frontend origins during development (e.g., Live Server, Vite, React)
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5500,http://localhost:8080
