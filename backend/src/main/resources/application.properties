# ===================================================================
# Application Configuration: Car Travel Booking System Backend
# ===================================================================

server.port=8080
spring.application.name=car-travel-booking

# ===================================================================
# Database Connection (MySQL)
# ===================================================================
# SECURITY: Never hardcode credentials here. Use environment variables.
# Set DB_USERNAME and DB_PASSWORD as environment variables before starting.
# Example (PowerShell): $env:DB_PASSWORD = "your_actual_password"
# Example (Linux/Mac):  export DB_PASSWORD=your_actual_password
spring.datasource.url=jdbc:mysql://localhost:3306/car_travel_booking?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
# STRICT RULE: Do not use 'create' or 'create-drop'
# 'none' disables auto-DDL and keeps existing tables as the source of truth
spring.jpa.hibernate.ddl-auto=none
# SECURITY: Disable SQL logging in production (prevents SQL from appearing in logs)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# PERFORMANCE: Disable open-in-view to prevent N+1 query issues and connection starvation
spring.jpa.open-in-view=false

# ===================================================================
# JWT (Security) Configuration
# ===================================================================
# SECURITY: Set JWT_SECRET as an environment variable. Never commit real secrets.
# Minimum 32-character random string recommended.
# Example: $env:JWT_SECRET = "your-secure-random-secret-at-least-32-chars"
app.jwt.secret=${JWT_SECRET:carTravelBookingSuperSecretKeyForJwtAuthentication2026ShouldBe256BitsLong!}
app.jwt.expiration-ms=86400000

# ===================================================================
# Google Maps API Configuration
# ===================================================================
app.google.maps.api-key=${GOOGLE_MAPS_API_KEY:YOUR_GOOGLE_MAPS_API_KEY}
app.google.maps.enabled=${GOOGLE_MAPS_ENABLED:false}

# ===================================================================
# Fare & Pricing Rules (Configurable Multipliers & Driver Allowance)
# ===================================================================
app.pricing.multiplier.one-way=1.0
app.pricing.multiplier.round-trip=2.0
app.pricing.multiplier.multi-day=2.0
app.pricing.driver-allowance.base=500.00
app.pricing.driver-allowance.per-extra-day=500.00

# ===================================================================
# CORS (Cross-Origin Resource Sharing) Configuration
# ===================================================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5500,http://localhost:8080
